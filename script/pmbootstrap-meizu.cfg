[pmbootstrap]
# NOTE: 下方绝对路径仅为兜底记录；实际以 wrapper 脚本的 -p/-w 参数为准
# （pmbootstrap-phoenix.sh / pmbootstrap-meizu.sh 均从脚本自身位置推导），
# 工作区文件夹改名后无需手改本文件。
# 与 K30 共享 aports 和 work dir（真正的资源：chroot/缓存/ccache/下载），
# 隔离的只有 device 选择。设备包+内核包已落共享 pmaports
# device/downstream/{device-meizu-meizu20,linux-meizu-meizu20}（cd9188c，
# 主线内核路线）；install 类命令已解锁，但 boot_b 组装仍走外部打包器
# （meizu20-m1/tools + handoff-stamp.py，Mu 契约与 pmOS boot.img 不符）。
aports = ~/work/pmos_linux/pmos/pmaports
device = meizu-meizu20
is_default_channel = False
service_manager = systemd
ssh_keys = True
# 2026-09-27：首版 rootfs 用 console（无头）——面板驱动未到位，plasma 无显示可用；
# 面板点亮后改回 plasma-mobile 重装即可（rootfs 换装不动 boot_a/Mu）。
ui = plasma-mobile
work = ~/work/pmos_linux/pmos/.pmbootstrap

[providers]

[mirrors]
# 与 K30 共用同一宿主网络环境：2026-09-20 晚起用户开代理，dl-cdn 官方源
# 提速（~3.4MB/s）；如遇限速恢复 NJU 的方法见 K30 侧 pmbootstrap.cfg 注释。
# pmOS 官方源始终不动。
