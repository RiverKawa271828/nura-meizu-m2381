# build-release — nura 云端构建（2026-10-13 立项；研究 = docs/CLOUD-BUILD-RESEARCH.md）
#
# 产出 = mu img + esp gz + rootfs gz ×2（双 UI：plasma-mobile + phosh，2026-11-22
#   用户拍板「两个都传，以后默认 plasma」）+ 固件 tarball + 变更 apk（相对 config.sh
#   现役钉）+ SHA256SUMS + 手动升级包 upgrade-<tag>.zip。
#   **发布形态 = DRAFT release**：上传+字节对拍全过后留草稿，公网发布 = 用户拍板
#   （r80 教训：草稿中途被杀 = 公网不可见，安全）。
# 触发 = workflow_dispatch 手动（发版窗口人为；CI 只构建 HEAD，勿在 CI bump）。
# fw tarball 引导：APKBUILD pkgrel=4 起 tarball 内容更新（modem_pr），而 CI 惯常
#   从「上一版 Release」拉——旧料对 r4 sha512 必炸。解法 = fw_seed_tag 输入指向
#   一个预建草稿（含 r4 tarball；草稿公网不可见；主流程结束可删，幂等重跑不受
#   影响——主流程只删 TAG=r<LREL> 的草稿）。
# 布局 = 树全部独立仓库（布局 v3），CI 经 NURA_*_DIR 钉子摆到 /mnt（runner 根盘
#   ~14GB 装不下 chroot+ccache，/mnt ~65GB）——本地与云端仅根不同，相对形状同构。
name: build-release

on:
  workflow_dispatch:
    inputs:
      ui_list:
        description: "rootfs UI 列表（空格分隔；每 UI 各出一个 rootfs gz）"
        required: false
        default: "plasma-mobile phosh"
      fw_seed_tag:
        description: "fw tarball 种子草稿 tag（空 = 从 config.sh PIN_RELEASE_BASE 拉）"
        required: false
        default: ""
      nuget_seed_tag:
        description: "Mu NuGet 缓存种子草稿 tag（空 = 直接走 Project Mu Azure feed）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  NURA_INSIDE_UNIT: "1"          # 脚本语义 =「已在宿主环境」→ 跳过 systemd-run 重入（CI 无 systemd）
  NURA_UI: plasma-mobile         # 默认 UI（2026-11-22 用户拍板「以后默认 plasma」；rootfs 段按 ui_list 逐个覆盖）
  NURA_LINUX_DIR: /mnt/nura-work/kernel
  NURA_MU_DIR: /mnt/nura-work/mu/Mu-Silicium
  NURA_PMAPORTS_DIR: /mnt/nura-work/pmaports
  NURA_PMB_CHECKOUT: /mnt/nura-work/pmbootstrap
  NURA_PMB_WORK: /mnt/nura-work/.pmbootstrap   # APK_DIR 随此推导
  NURA_LINUXBREW: /home/linuxbrew/.linuxbrew/bin
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 首轮冷编译预算（emulated chroot 段偏慢）；后续轮 ccache 命中大幅缩短
    steps:
      - uses: actions/checkout@v4

      - name: Prepare /mnt work root
        run: sudo mkdir -p /mnt/nura-work && sudo chown "$USER":"$USER" /mnt/nura-work

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/nura-work/.pmbootstrap/cache_ccache_aarch64
            /mnt/nura-work/.pmbootstrap/cache_ccache_x86_64
          key: ccache-aarch64-${{ github.run_id }}
          restore-keys: ccache-aarch64-

      - name: Fix ccache permissions
        run: |
          # 十六跑定谳：actions/cache 恢复后目录属主=runner 用户，pmbootstrap
          # chroot 构建用户（映射 uid 不同）写入 .ccache/tmp 即 Permission denied，
          # 内核步 ~90s 必炸；当轮自建缓存属主正确故 #13 前不踩。构建 uid 不定，
          # 恢复后直接放权最稳。
          chmod -R a+rwX "$NURA_PMB_WORK/cache_ccache_aarch64" 2>/dev/null || true
          chmod -R a+rwX "$NURA_PMB_WORK/cache_ccache_x86_64" 2>/dev/null || true

      - name: Host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git python3 python3-venv curl mtools zip \
            build-essential uuid-dev nasm lld gcc-aarch64-linux-gnu mono-devel
          # pmbootstrap 唯一正源 = gitlab.postmarketos.org（无 GitHub 官方镜像、不在
          # PyPI、第三方镜像全过期——#7 定谳）。#4/#5 的挂死 = gitlab 坏窗口
          # （#1-#3 同一时段可用），处置 = 有界 clone + 三次重试 + 快速失败：
          # 最坏分钟级可见错误，不再无限挂死。
          OK=0
          for i in 1 2 3; do
            if timeout 240 git clone --depth 1 \
                https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
                "$NURA_PMB_CHECKOUT"; then OK=1; break; fi
            rm -rf "$NURA_PMB_CHECKOUT"
            echo "(i) gitlab clone 第 $i 次失败/超时，20s 后重试"; sleep 20
          done
          [ "$OK" = 1 ] || { echo "!! pmbootstrap 三次获取失败（gitlab 不可达？）"; exit 1; }
          python3 "$NURA_PMB_CHECKOUT/pmbootstrap.py" --version

      - name: Clone source trees (shallow + bounded)
        timeout-minutes: 20
        run: |
          set -e
          # 浅 clone（CI 只需 HEAD 构建产物，git archive 照常可用；全史 clone 是
          # 八跑卡死根源：内核 fork 带整条 linux 历史 ~2GB）。直接 clone = timeout
          # 的直接子进程，杀得动（八跑教训：timeout 包 bash 时孙进程 git 孤儿化
          # 握死日志管道，timeout 形同虚设 → 一律用 step 级 timeout-minutes）。
          clone_shallow() { # <url> <dir> <branch>
            [ -e "$2/.git" ] && { echo "  ✓ $2 已在位"; return 0; }
            timeout 480 git clone --depth 1 --branch "$3" "$1" "$2"
          }
          clone_shallow https://github.com/RiverKawa271828/linux-mobile-ports \
            "$NURA_LINUX_DIR" meizu20-t4b
          clone_shallow "$(bash -c '. ./config.sh && echo "$PIN_PMAPORTS_GIT"')" \
            "$NURA_PMAPORTS_DIR" phoenix
          clone_shallow "$(bash -c '. ./config.sh && echo "$PIN_MU_GIT"')" \
            "$NURA_MU_DIR" meizu20-mars-port
          # 补 Mu Binaries submodule + pmbootstrap 跳过检查（树全在位则纯校验）
          env NURA_SKIP_DOCTOR=1 bash script/setup.sh --clone

      - name: pmbootstrap work dir seed（跳过交互 init）
        timeout-minutes: 5
        run: |
          # 九跑教训：init 是交互 wizard，下游端口确认空 Enter=拒绝 → 136 万次重问
          # 循环被步界处决。而 init 对 CI 的持久效果 = work dir + version 标记
          # （十跑教训：纯 mkdir 会撞「work folder version needs migration」——
          # 空目录版本标记缺失，pmbootstrap 拒绝迁移）。配置状态由 wrapper 每次
          # 显式 -c 提供，故种子 = version 文件 + 两道保险：
          git -C "$NURA_PMAPORTS_DIR" remote add pmos \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git 2>/dev/null || true
          timeout 30 git -C "$NURA_PMAPORTS_DIR" fetch --depth 1 \
            pmos main:refs/remotes/pmos/main 2>/dev/null || echo "(i) 官方 fetch 失败/超时，用 fork 快照"
          git -C "$NURA_PMAPORTS_DIR" update-ref refs/remotes/pmos/main refs/remotes/origin/main 2>/dev/null || true
          mkdir -p "$NURA_PMB_WORK"
          echo 8 > "$NURA_PMB_WORK/version"   # pmb/config/__init__.py work_version
          echo "work dir seeded: $NURA_PMB_WORK (version 8)"

      - name: Firmware tarball from Release → pmaports package dir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKGDIR="$NURA_PMAPORTS_DIR/device/downstream/firmware-meizu-meizu20"
          mkdir -p "$PKGDIR"
          if [ -n "${{ github.event.inputs.fw_seed_tag }}" ]; then
            # 种子草稿通道（r4 起 tarball 内容更新，旧 Release 料对不上 sha512；
            # 草稿公网不可见，gh 走 token 鉴权可下）
            gh release download "${{ github.event.inputs.fw_seed_tag }}" \
              --repo "$GITHUB_REPOSITORY" --pattern "firmware-meizu-meizu20.tar.gz" \
              --output "$PKGDIR/firmware-meizu-meizu20.tar.gz"
          else
            REL_BASE=$(bash -c '. ./config.sh && echo "$PIN_RELEASE_BASE"')
            curl -fsSL --retry 3 -o "$PKGDIR/firmware-meizu-meizu20.tar.gz" \
              "$REL_BASE/firmware-meizu-meizu20.tar.gz"
          fi
          sha512sum "$PKGDIR/firmware-meizu-meizu20.tar.gz"   # APKBUILD 自验 sha512（不符即 build 报错）

      - name: Derive release vars (REL_BASE / ESP_VER / TAG)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ESP 版本按轮生命周期取值（三态，十跑教训：max+1 在「设备日已定版」阶段
          # 会算出 68 而正确值 = 钉子 67）：
          #   pin > release（轮进行中，本地腿已建已定版）→ 取 pin（CI 同号异字节=各自真值）
          #   pin ≤ release（上轮已发布，新轮未开工）→ release + 1
          LAST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 5 \
            --json tagName --jq '.[0].tagName')
          PREV_REL=0
          if [ -n "$LAST_TAG" ]; then
            PREV_REL=$(gh release view "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -oP '^esp-recovery-v\K[0-9]+' | sort -n | tail -1 || true)
            PREV_REL=${PREV_REL:-0}
          fi
          PREV_PIN=$(bash -c '. ./config.sh && [[ $REL_ESP_IMG =~ esp-recovery-v([0-9]+)\.img ]] && echo "${BASH_REMATCH[1]}"')
          PREV_PIN=${PREV_PIN:-0}
          if [ "$PREV_PIN" -gt "$PREV_REL" ]; then ESP="$PREV_PIN"; else ESP=$((PREV_REL+1)); fi
          echo "ESP_VER=$ESP" >> "$GITHUB_ENV"
          LREL=$(grep -m1 '^pkgrel=' "$NURA_PMAPORTS_DIR/device/downstream/linux-meizu-meizu20/APKBUILD" | cut -d= -f2)
          echo "TAG=r$LREL" >> "$GITHUB_ENV"
          echo "TAG=r$LREL  ESP=v$ESP（release=$PREV_REL pin=$PREV_PIN）"

      - name: Mu toolchain (linuxbrew clang + tree venv)
        timeout-minutes: 30
        run: |
          set -e
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          # 十二跑定谳：fresh Homebrew bin 只有 brew 本体，clang/llvm-objcopy 必须
          # 显式 brew install llvm（本机能过 = 本地 brew 早年装过）。验证一律不用
          # 管道——`x --version | head -1` 管道早退假阴性（工程规则#2）就是十二跑
          # 验证假绿的通道。
          /home/linuxbrew/.linuxbrew/bin/brew install llvm lld
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          # 十七/十八跑定谳：新 brew 把 lld 拆成独立配方（llvm 配方连 ld.lld 都不带
          # 了），EDK2 CLANGPDB 的 CI 全新 Conf 要 Cellar 路径下 lld-link 与
          # lld-link.exe 两个名字。lld 配方装好后从 bin/lld-link 的绝对真身补 .exe
          # 链；验证一律直查绝对路径——PATH fallback 会让 Ubuntu apt 的 lld 冒名
          # 应答（十八跑实测 Ubuntu LLD 18.1.3 假绿）。
          LLB=/home/linuxbrew/.linuxbrew/bin
          LLCELL=$(dirname "$(readlink -f "$LLB/clang")")
          LTGT=$(readlink -f "$LLB/lld-link")
          for d in "$LLB" "$LLCELL"; do
            for n in lld-link lld-link.exe; do
              [ -e "$d/$n" ] || ln -s "$LTGT" "$d/$n"
            done
          done
          clang --version
          llvm-objcopy --version
          "$LLB/lld-link" --version
          "$LLCELL/lld-link" --version
          "$LLB/lld-link.exe" --version
          "$LLCELL/lld-link.exe" --version
          # Mu venv：build-mu.sh 硬性要求 .venv/bin/python（coloredlogs 等）
          cd "$NURA_MU_DIR"
          python3 -m venv .venv
          .venv/bin/pip install -r pip-requirements.txt

      - name: Kernel + device + ESP（顺序铁律：apk 先于 ESP；版本显式传参防 clone 无历史撞号）
        timeout-minutes: 180
        run: |
          # 十四跑教训：pmbootstrap 失败时控制台只有一行总结，真错误在 log.txt，
          # runner 销毁即失明——败时必吐尾部。十五跑补课：make -j 并行会把报错行
          # 顶出 tail 窗口，改为定向抓错误行 + 系统态三件套（盘/内存/OOM）。
          die() {
            rc=$?
            echo "=== log.txt error lines (tail 40) ==="
            grep -inE "error:|error |killed|no space|warning:|undefined|cannot find|failed" "$NURA_PMB_WORK/log.txt" 2>/dev/null | tail -40
            echo "=== log.txt tail 30 ==="
            tail -30 "$NURA_PMB_WORK/log.txt" 2>/dev/null
            echo "=== df /mnt ==="; df -h /mnt | tail -1
            echo "=== free ==="; free -m | head -2
            echo "=== oom-kill? ==="; sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory" | tail -5
            exit "$rc"
          }
          bash script/build-kernel.sh || die
          bash script/build-device.sh || die
          bash script/build-esp.sh "$ESP_VER" || die

      - name: Save ccache（失败也落袋；#11 教训：败轮丢 2.5h 冷编）
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/nura-work/.pmbootstrap/cache_ccache_aarch64
            /mnt/nura-work/.pmbootstrap/cache_ccache_x86_64
          key: ccache-aarch64-${{ github.run_id }}

      - name: Prepare mu_nasm NuGet cache（curl 自取；seed 兜底）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 2026-11-24：Project Mu 的 Azure feed 对 GitHub runner 的 nuget CLI
          # 拉取稳定失败（mu_nasm@20016.1.1 "failed to install this version"；
          # 本机同 URL 200/5MB 正常）。两条通道：
          #   ① 首选 curl 直取 nupkg（跟随 303 重定向）→ 手工铺成 NuGet 全局缓存
          #      （布局 <pkg>/<ver>/<pkg>/…，与 edk2toolext
          #      nuget_dependency._fetch_from_nuget_cache 判据逐字对齐 = 命中即跳过联网）
          #   ② 兜底 = nuget_seed_tag 隐藏草稿里的预解压缓存 tarball
          V=20016.1.1
          D="$HOME/.nuget/packages/mu_nasm/$V"
          URL="https://pkgs.dev.azure.com/projectmu/mu/_packaging/Basetools-Binary/nuget/v3/flat2/mu_nasm/$V/mu_nasm.$V.nupkg"
          ok=0
          for i in 1 2 3; do
            echo "== curl attempt $i/3 =="
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o /tmp/mu_nasm.nupkg "$URL"; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" = 1 ]; then
            mkdir -p "$D"
            unzip -q -o /tmp/mu_nasm.nupkg -d "$D"
            cp /tmp/mu_nasm.nupkg "$D/mu_nasm.$V.nupkg"
            echo "== cache built from feed =="
          elif [ -n "${{ github.event.inputs.nuget_seed_tag }}" ]; then
            echo "== feed unreachable → seed draft fallback =="
            gh release download "${{ github.event.inputs.nuget_seed_tag }}" \
              --repo "$GITHUB_REPOSITORY" --pattern "mu_nasm-nugetcache.tar.gz" \
              --output /tmp/mu_nasm-nugetcache.tar.gz
            mkdir -p "$HOME/.nuget/packages"
            tar xzf /tmp/mu_nasm-nugetcache.tar.gz -C "$HOME/.nuget/packages"
          else
            echo "mu_nasm cache unavailable (feed down, no seed)"; exit 1
          fi
          ls "$D/mu_nasm" | head -5
          nuget locals global-packages -list || true

      - name: Mu（r85 = config-only 轮 → --no-sync，FdtBlob 不换）
        timeout-minutes: 40
        run: |
          # 重试三次 + 间隔 60s（feed 抽风兜底；有种子时实测不进网络）
          for i in 1 2 3; do
            echo "== Mu build attempt $i/3 =="
            if bash script/build-mu.sh --no-sync; then exit 0; fi
            echo "attempt $i failed (nuget feed flake?); retry in 60s"
            sleep 60
          done
          echo "Mu build failed after 3 attempts"; exit 1

      - name: Rootfs（双 UI 循环；pmbootstrap install --single-partition 铁律在脚本内）
        timeout-minutes: 180
        run: |
          set -e
          for ui in ${{ github.event.inputs.ui_list }}; do
            echo "== rootfs build: $ui =="
            # zap 防上一 UI 的 chroot world 残留（build-rootfs 对 world 不符直接
            # die，脚本头有注记）；空 work dir 首轮 zap = 无害 no-op
            bash script/pmbootstrap-meizu.sh -y zap >/dev/null 2>&1 || true
            NURA_UI="$ui" bash script/build-rootfs.sh
          done

      - name: Verify（交付链全对拍）
        timeout-minutes: 8
        run: bash script/verify.sh

      - name: Stage release assets + manual upgrade zip + SHA256SUMS
        run: |
          set -euo pipefail
          . ./config.sh   # NURA_ROOT/REL_* 钉子（#20：未 source 前直接引用 = unbound）
          STAGE="$GITHUB_WORKSPACE/staging"; mkdir -p "$STAGE"
          ART="$NURA_ROOT/artifacts"
          APK="$NURA_PMB_WORK/packages/edge/aarch64"
          LDIR="$NURA_PMAPORTS_DIR/device/downstream/linux-meizu-meizu20"
          DDIR="$NURA_PMAPORTS_DIR/device/downstream/device-meizu-meizu20"
          FDIR="$NURA_PMAPORTS_DIR/device/downstream/firmware-meizu-meizu20"
          gp() { grep -m1 '^pkgrel=' "$1/APKBUILD" | cut -d= -f2; }

          MU_IMG=$(ls -t "$ART"/mu-r*.img | head -1)
          ESP_GZ=$(ls "$ART"/esp-recovery-v"$ESP_VER".img.gz)
          # 双 UI 件（2026-11-22 拍板：plasma + phosh 各一件）
          ROOTFS_GZS=$(ls "$ART"/meizu-meizu20-"$TAG"-*.img.gz)
          FW_TB="$FDIR/firmware-meizu-meizu20.tar.gz"
          LREL=$(gp "$LDIR"); DREL=$(gp "$DDIR"); FREL=$(gp "$FDIR")
          LIN_APK="$APK/linux-meizu-meizu20-$(grep -m1 '^pkgver=' "$LDIR/APKBUILD" | cut -d= -f2)-r$LREL.apk"
          cp -v $ROOTFS_GZS "$STAGE/"
          cp -v "$MU_IMG" "$ESP_GZ" "$FW_TB" "$LIN_APK" "$STAGE/"

          # 升级包 = linux apk + ESP gz（+ 本轮相对现役钉有变的 device/fw apk）+ UPGRADE.md 抄本
          UP="$STAGE/upgrade-$TAG"; mkdir -p "$UP"
          cp "$LIN_APK" "$ESP_GZ" docs/UPGRADE.md "$UP/"
          if [ "$DREL" -gt "$REL_DEVICE_PKGREL" ]; then cp "$APK/device-meizu-meizu20-1-r$DREL.apk" "$UP/"; fi
          if [ "$FREL" -gt "$REL_FW_PKGREL" ];     then cp "$APK/firmware-meizu-meizu20-1-r$FREL.apk" "$UP/"; fi
          (cd "$STAGE" && zip -qr "upgrade-$TAG.zip" "upgrade-$TAG")

          (cd "$STAGE" && sha256sum mu-r*.img esp-recovery-v*.img.gz \
            meizu-meizu20-*.img.gz firmware-meizu-meizu20.tar.gz \
            linux-meizu-meizu20-*.apk upgrade-*.zip > SHA256SUMS)

          # 发布真值 = 本 SHA256SUMS（apk/rootfs/Mu 非字节确定构建，本地 sha8 不外推）
          cat "$STAGE/SHA256SUMS"
          {
            echo "## $TAG（云端构建草稿 — 公网发布前须用户验收）"
            echo
            echo "配对：mu $(basename "$MU_IMG") + ESP $(basename "$ESP_GZ") + 内核 apk r$LREL（期望 uname #=$((LREL+1))）"
            echo "- rootfs 双 UI 件（2026-11-22 拍板：默认 plasma-mobile；phosh 并行供给）：meizu-meizu20-$TAG-*.img.gz 按需选刷"
            echo "- 升级（数据保留）：下载 \`upgrade-$TAG.zip\`，两步法见包内 UPGRADE.md"
            echo "- 全新装机：README → FLASHING 快速路径 A（三件直刷）"
            echo "- 上传验收：草稿上传后资产字节数逐件对拍全等（r72 教训）；发布真值 = SHA256SUMS"
          } > "$STAGE/notes.md"

      - name: Upload workflow artifacts（发布兜底：草稿未发也可取件）
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ env.TAG }}
          path: staging/*
          if-no-files-found: error

      - name: Draft release + upload + byte-count acceptance（草稿制；公网发布 = 用户拍板）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/staging"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true   # 幂等重跑
          gh release create "$TAG" --draft --title "$TAG" --notes-file "$STAGE/notes.md"
          gh release upload "$TAG" "$STAGE"/mu-r*.img "$STAGE"/esp-recovery-v*.img.gz \
            "$STAGE"/meizu-meizu20-*.img.gz "$STAGE"/firmware-meizu-meizu20.tar.gz \
            "$STAGE"/linux-meizu-meizu20-*.apk "$STAGE"/upgrade-*.zip "$STAGE"/SHA256SUMS
          # r72 教训闭环：上传后逐件字节数对拍（gzip -t 已在生成时内建）
          gh release view "$TAG" --json assets --jq '.assets[] | [.name, .size] | @tsv' > /tmp/uploaded.tsv
          while IFS=$'\t' read -r name size; do
              local_size=$(stat -c%s "$STAGE/$name")
              if [ "$size" != "$local_size" ]; then
                echo "✗ 字节不符: $name 远端=$size 本地=$local_size"; exit 1
              fi
              echo "✓ $name = $size"
          done < /tmp/uploaded.tsv
          echo "== DRAFT $TAG 就绪（公网不可见）；发布 = 用户在 Releases 页拍板 =="
