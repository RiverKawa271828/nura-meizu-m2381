name: probe-nuget
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl mu_nasm from Project Mu Azure feed
        run: |
          URL="https://pkgs.dev.azure.com/projectmu/mu/_packaging/Basetools-Binary/nuget/v3/flat2/mu_nasm/20016.1.1/mu_nasm.20016.1.1.nupkg"
          for i in 1 2 3; do
            echo "== attempt $i =="
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 -o /tmp/mu_nasm.nupkg "$URL"; then
              echo "CURL_OK size=$(stat -c%s /tmp/mu_nasm.nupkg)"; exit 0
            fi
            sleep 15
          done
          echo "CURL_FAILED"; exit 1
