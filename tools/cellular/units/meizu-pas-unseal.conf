[Service]
# 解封追加段（cell 双卡轮 2026-11-19）：封印 ADSP/CDSP 流程原样保留后，尾接解封 mpss
ExecStart=
ExecStart=/bin/sh -c "echo none > /sys/bus/platform/devices/4080000.remoteproc/driver_override; D=/sys/bus/platform/drivers/qcom_q6v5_pas; echo 0 > /sys/bus/platform/drivers_autoprobe; modprobe qcom_q6v5_pas; for dev in 6800000.remoteproc 32300000.remoteproc; do echo $dev > $D/bind 2>/dev/null; done; echo 1 > /sys/bus/platform/drivers_autoprobe; echo \"\" > /sys/bus/platform/devices/4080000.remoteproc/driver_override; echo 4080000.remoteproc > $D/bind 2>/dev/null; echo start > /sys/class/remoteproc/remoteproc2/state 2>/dev/null"
